<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 核心資安驗證系統</title>
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0b0e14; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .box { background: #151c28; max-width: 400px; margin: 50px auto; padding: 30px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); border: 1px solid #222d42; }
        h2 { color: #00e5ff; margin-top: 0; }
        input[type="password"] { width: 100%; padding: 12px; margin: 15px 0; border-radius: 6px; border: 1px solid #334460; background: #0b0e14; color: #fff; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #00e5ff; border: none; border-radius: 6px; color: #0b0e14; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #334460; color: #7788a0; cursor: not-allowed; }
        #status { color: #ffb700; font-size: 14px; margin-bottom: 15px; min-height: 40px; }
        #map { height: 300px; width: 100%; border-radius: 8px; margin-top: 15px; display: none; }
        .hidden { display: none; }
        .panel { background: #1f293d; padding: 15px; border-radius: 8px; text-align: left; margin-top: 20px; word-break: break-all; }
        a { color: #00e5ff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box" id="loginBox">
        <h2>身分安全驗證</h2>
        <p id="status">📡 正在安全校驗雲端加密防禦鏈結...</p>
        <input type="password" id="pwdInput" placeholder="請輸入安全存取密碼" disabled>
        <button id="loginBtn" onclick="verifyPassword()" disabled>驗證並解鎖系統</button>
    </div>
    <div class="box hidden" id="mainPage">
        <h2>📂 系統主頁 - 檔案下載區</h2>
        <p style="color: #00ff88;">驗證通過：一般使用者權限</p>
        <div class="panel">
            <h3>機密大檔案清單：</h3>
            <ul>
                <li><a href="https://w3.org" target="_blank">💾 點我下載免費託管測試大檔案.pdf</a></li>
            </ul>
        </div>
    </div>
    <div class="box hidden" id="adminPage" style="max-width: 600px;">
        <h2>🛠️ 核心高階安全管理後台</h2>
        <p style="color: #ff3366;">驗證通過：管理員最高權限</p>
        <button onclick="emergencyUnlock()" style="background: #ff3366; color: #fff; margin-bottom: 15px;">🔓 一鍵重設解鎖全系統</button>
        <div class="panel">
            <h3>🚨 輸錯三次密碼者 - 實體定位軌跡追蹤：</h3>
            <div id="map"></div>
        </div>
    </div>
        <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDx1-IbLq1-twOKWnyvIiQA8vUZGqvzD18",
            databaseURL: "https://firebasedatabase.app"
        };

        let db = null; let userLat = 0; let userLng = 0;

        try {
            if (typeof firebase !== 'undefined') {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
            }
        } catch (e) { console.error("Firebase init failed"); }

        window.onload = function() {
            if (db !== null && typeof db !== 'undefined') {
                db.ref('system_status').once('value').then((snapshot) => {
                    if (!snapshot.exists()) {
                        db.ref('system_status').set({ failed_attempts: 0, is_locked: false, lock_until: 0 });
                        db.ref('passwords').set({ admin: "admin999", main: "user123" });
                    }
                }).then(() => {
                    db.ref('system_status').on('value', (snapshot) => {
                        const status = snapshot.val();
                        if (status && status.is_locked && Date.now() < status.lock_until) {
                            document.getElementById("status").innerHTML = "<span style='color:red;'>⚠️ 系統正處於全面防禦鎖定中，請等候 30 分鐘！</span>";
                            document.getElementById("pwdInput").disabled = true; document.getElementById("loginBtn").disabled = true;
                            return;
                        }
                        triggerGeolocation();
                    });
                }).catch((err) => { triggerGeolocation(); });
            } else { triggerGeolocation(); }
        };

        function triggerGeolocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLat = position.coords.latitude; userLng = position.coords.longitude;
                        document.getElementById("status").innerText = "✅ GPS 實體定位稽核成功。密碼輸入框已解鎖。";
                        document.getElementById("pwdInput").disabled = false; document.getElementById("loginBtn").disabled = false;
                    },
                    (error) => { document.getElementById("status").innerHTML = "<span style='color:red;'>❌ 安全阻擋：必須允許位置存取才能使用本系統。</span>"; },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            }
        }

        function verifyPassword() {
            const inputPwd = document.getElementById("pwdInput").value;
            if(!inputPwd || userLat === 0 || userLng === 0) return;

            let targetAdmin = "admin999"; let targetMain = "user123"; let currentFailedAttempts = 0;

            if (db === null || typeof db === 'undefined') {
                executeBypassVerification(inputPwd, targetAdmin, targetMain);
                return;
            }

            db.ref().once('value').then((snapshot) => {
                const data = snapshot.val();
                if (data && data.passwords) {
                    targetAdmin = data.passwords.admin || "admin999";
                    targetMain = data.passwords.main || "user123";
                }
                if (data && data.system_status) {
                    currentFailedAttempts = Number(data.system_status.failed_attempts || 0);
                }

                if (inputPwd === targetAdmin) {
                    document.getElementById("loginBox").classList.add("hidden");
                    document.getElementById("adminPage").classList.remove("hidden");
                    loadHackerMap();
                } else if (inputPwd === targetMain) {
                    document.getElementById("loginBox").classList.add("hidden");
                    document.getElementById("mainPage").classList.remove("hidden");
                } else {
                    let updatedAttempts = currentFailedAttempts + 1;
                    let logRef = db.ref('attacker_logs').push();
                    logRef.set({ ip: "偵測中...", lat: userLat, lng: userLng, timestamp: Date.now() });

                    fetch('https://ipify.org')
                    .then(res => res.json()).then(ipData => { logRef.update({ ip: ipData.ip }); })
                    .catch(e => { logRef.update({ ip: "VPN/防火牆環境" }); });

                    if (updatedAttempts >= 3) {
                        db.ref('system_status').update({ failed_attempts: updatedAttempts, is_locked: true, lock_until: Date.now() + (30 * 60 * 1000) }).then(() => { window.location.reload(); });
                    } else {
                        db.ref('system_status').update({ failed_attempts: updatedAttempts });
                        document.getElementById("status").innerHTML = `<span style='color:red;'>❌ 密碼錯誤！剩餘次數：${3 - updatedAttempts}次</span>`;
                    }
                }
            }).catch((err) => { executeBypassVerification(inputPwd, targetAdmin, targetMain); });
        }

        function executeBypassVerification(input, admin, main) {
            if (input === admin) {
                document.getElementById("loginBox").classList.add("hidden"); document.getElementById("adminPage").classList.remove("hidden"); loadHackerMap();
            } else if (input === main) {
                document.getElementById("loginBox").classList.add("hidden"); document.getElementById("mainPage").classList.remove("hidden");
            } else { alert("防護提示：密碼不正確！"); }
        }

        function loadHackerMap() {
            document.getElementById("map").style.display = "block";
            var map = L.map('map').setView([userLat, userLng], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            if (db !== null && typeof db !== 'undefined') {
                db.ref('attacker_logs').once('value').then((snapshot) => {
                    if(snapshot.exists()) {
                        snapshot.forEach((childSnapshot) => {
                            const val = childSnapshot.val();
                            L.marker([val.lat, val.lng]).addTo(map).bindPopup(`<b>侵入者 IP:</b> ${val.ip}<br><b>時間:</b> ${new Date(val.timestamp).toLocaleString()}`);
                        });
                    }
                });
            }
        }

        function emergencyUnlock() {
            if (db !== null && typeof db !== 'undefined') {
                db.ref('system_status').update({ failed_attempts: 0, is_locked: false, lock_until: 0 }).then(() => { alert("系統已成功重設！限制已解除。"); window.location.reload(); });
            } else { window.location.reload(); }
        }
    </script>
</body>
</html>
